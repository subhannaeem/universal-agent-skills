<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluid demo</title>
<style>
:root{--s30:clamp(.75rem,2vw,1.25rem);--s40:clamp(1rem,4vw,2.5rem)}
body{font:clamp(1rem,1rem + .4vw,1.25rem)/1.6 system-ui;margin:0;padding:0 var(--s40)}
h1{font-size:clamp(2rem,1rem + 4vw,4rem)}
.card-wrap{container-type:inline-size;max-width:72rem;margin:auto}
.card{display:grid;gap:var(--s30);background:#eef;padding:var(--s30);border-radius:12px}
.card div{background:#99c;min-height:6rem;border-radius:8px}
@container (min-width:32rem){.card{grid-template-columns:1fr 2fr;align-items:center}}
</style>
<h1>Fluid heading</h1>
<div class="card-wrap"><div class="card"><div></div><p>Resize the window: type and spacing scale smoothly, and the card switches to two columns when its container is wide enough.</p></div></div>
